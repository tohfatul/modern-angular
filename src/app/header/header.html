<mat-toolbar class="main-header">
  <button matButton>
    <mat-icon aria-hidden="false" aria-label="Home" fontIcon="store"></mat-icon>
  </button>
  <span class="branding">My Store in Angular</span>
  <span class="spacer"></span>
  <button mat-button>Products</button>
  <button matButton>
    <mat-icon
      [matBadge]="cartService.totalItems()"
      [matBadgeHidden]="cartService.totalItems() === 0"
      aria-hidden="false"
      aria-label="Cart"
      fontIcon="shopping_cart"
    ></mat-icon>
  </button>
</mat-toolbar>
